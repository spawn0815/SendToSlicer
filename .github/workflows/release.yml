name: Release

# Push a tag like v1.0.1 (matching the version in blender_manifest.toml)
# and this workflow builds the ZIP and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build extension ZIP
        run: python build.py --tag "${{ github.ref_name }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
